<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile View Test - Top Action Row & Active Exam Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #041321;
    }
  </style>
</head>
<body class="p-4 sm:p-8 max-w-md mx-auto min-h-screen text-slate-100 space-y-6">

  <div class="text-xs font-black uppercase tracking-widest text-[#C5A97A] text-center mb-2">
    Mobile View Preview (Max-Width 448px)
  </div>

  <!-- Top Action Row (History comes first on mobile, Streak second) -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <!-- Practice History Button: order-1 on mobile, order-2 on sm+ -->
    <div class="order-1 sm:order-2 flex items-center justify-start sm:justify-end w-full sm:w-auto">
      <button
        type="button"
        class="w-full sm:w-auto px-5 py-3.5 sm:py-2.5 bg-[#072238]/90 hover:bg-[#0a2f4c] border border-[#C5A97A]/40 text-white rounded-2xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2.5 transition-all shadow-sm"
      >
        <span class="iconify text-[#C5A97A] text-base" data-icon="lucide:history"></span>
        <span>Practice History</span>
      </button>
    </div>

    <!-- Main Evolving Streak Widget: order-2 on mobile, order-1 on sm+ -->
    <div class="order-2 sm:order-1 flex flex-wrap items-center gap-3 w-full sm:w-auto">
      <div
        class="group relative flex items-center gap-4 px-4 py-3 bg-[#072238]/90 backdrop-blur-md rounded-2xl border border-gray-800 shadow-sm w-full sm:w-auto"
        style="box-shadow: 0 0 24px rgba(251, 191, 36, 0.25);"
      >
        <!-- Icon Box -->
        <div class="rounded-2xl shrink-0 w-16 h-16 flex items-center justify-center relative overflow-hidden bg-gradient-to-t from-amber-500/20 to-orange-500/10 border border-amber-500/30">
          <span class="iconify text-amber-400 text-3xl" data-icon="lucide:flame"></span>
        </div>

        <!-- Text Details -->
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-xl md:text-2xl font-black text-white leading-none tracking-tight block">
              1 Day
            </span>
          </div>
          <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mt-1.5 flex items-center gap-1">
            <span>Practice Streak</span>
            <span class="iconify text-[#C5A97A] text-xs" data-icon="lucide:arrow-right"></span>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Active Ongoing Exam Session Card (Redesigned & Properly Aligned) -->
  <div class="bg-[#0b253a] border-2 border-amber-500/50 rounded-3xl p-5 sm:p-7 shadow-2xl relative overflow-hidden">
    <!-- Decorative ambient glows -->
    <div class="absolute -top-16 -right-16 w-52 h-52 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -left-16 w-52 h-52 bg-orange-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 flex flex-col gap-5">
      <!-- 1. Header Strip: Status Indicator on Left, Live Monospace Countdown on Right -->
      <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">
            Active In-Progress Session
          </span>
        </div>

        <!-- High-Contrast Monospace Countdown Pill -->
        <div class="flex items-center gap-2 px-3.5 py-1.5 bg-black/60 border border-amber-500/40 rounded-xl shadow-inner">
          <span class="iconify text-amber-400 text-sm animate-pulse" data-icon="lucide:clock-4"></span>
          <span class="font-mono text-sm sm:text-base font-black text-amber-300 tracking-wider">
            42m 18s
          </span>
          <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">
            left
          </span>
        </div>
      </div>

      <!-- 2. Main Content Body: Icon + Subject Title + Year Tag + Explanation -->
      <div class="flex items-start sm:items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 text-white flex items-center justify-center shrink-0 shadow-lg shadow-amber-500/25">
          <span class="iconify text-white text-2xl" data-icon="lucide:file-text"></span>
        </div>

        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-2.5">
            <h3 class="text-lg sm:text-xl font-black text-white uppercase tracking-tight">
              English Language
            </h3>
            <span class="px-2.5 py-0.5 rounded-lg text-xs font-black bg-amber-500/20 text-amber-300 border border-amber-500/30">
              Year 2005
            </span>
          </div>
          <p class="text-xs text-gray-300 mt-1 leading-relaxed">
            Your exam practice is in progress and your answers are safely saved. You can rejoin and finish your test before the time runs out.
          </p>
        </div>
      </div>

      <!-- 3. Balanced Action Buttons -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-end gap-3 pt-1">
        <button
          type="button"
          class="order-2 sm:order-1 px-5 py-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl font-bold text-xs uppercase tracking-wider transition-all text-center flex items-center justify-center gap-2"
        >
          <span class="iconify text-sm" data-icon="lucide:trash-2"></span>
          <span>Abandon Exam</span>
        </button>

        <button
          type="button"
          class="order-1 sm:order-2 px-7 py-3.5 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500 hover:from-amber-600 text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 flex items-center justify-center gap-2 transition-all"
        >
          <span class="iconify text-base" data-icon="lucide:play-circle"></span>
          <span>Resume Exam Now</span>
          <span class="iconify text-sm" data-icon="lucide:arrow-right"></span>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
